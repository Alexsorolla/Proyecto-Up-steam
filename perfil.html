<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Perfil de usuario</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Roboto', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #f7f7f7, #e3e3e3);
    }

    .perfil-container {
        background: linear-gradient(to bottom, #ffffff, #ffe5e5);
        border-radius: 25px;
        padding: 30px 25px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        text-align: center;
        animation: fadeIn 0.7s ease-in-out;
    }

    #fotoPerfil {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid #d32f2f;
        margin-bottom: 20px;
        transition: transform 0.3s;
    }
    #fotoPerfil:hover { transform: scale(1.05); }

    h2 {
        font-size: 1.8rem;
        color: #d32f2f;
        margin-bottom: 15px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    .dato {
        font-size: 1.05rem;
        margin: 8px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
    }

    .dato span {
        margin-left: 8px;
        font-weight: 500;
        color: #555;
    }

    /* Íconos simples usando emojis */
    .icon { font-size: 1.2rem; }

    @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(-20px);}
        100% { opacity: 1; transform: translateY(0);}
    }
</style>
</head>
<body>

<div class="perfil-container">
    <img id="fotoPerfil" src="" alt="Foto del usuario">
    <h2 id="nombrePerfil">Cargando...</h2>
    <div class="dato"><span class="icon">🎂</span><span id="edadPerfil"></span></div>
    <div class="dato"><span class="icon">⚧</span><span id="sexoPerfil"></span></div>
    <div class="dato"><span class="icon">📏</span><span id="estaturaPerfil"></span></div>
    <div class="dato"><span class="icon">🥋</span><span id="experienciaPerfil"></span></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const nombreUsuario = params.get('nombre') || "Usuario";
    document.getElementById('nombrePerfil').textContent = nombreUsuario;

    const nombresFemeninos = ['Luna','Aurora','Violeta','Sol','Nube','Estrella','Mar','Cielo','Coral','Brisa','Rosa','Jade','Lirio','Ambar','Flora','Selva','Alba','Oceana','Nieve','Oliva'];
    const nombresMasculinos = ['Leo','Mateo','Lucas','Hugo','Adrian','Daniel','Javier','David','Ivan','Carlos','Alvaro','Sergio','Mario','Gabriel','Pablo','Andres','Victor','Enrique','Marco','Diego'];

    let sexo = 'female';
    if(nombresMasculinos.includes(nombreUsuario)) sexo = 'male';
    else if(nombresFemeninos.includes(nombreUsuario)) sexo = 'female';
    else sexo = Math.random() < 0.5 ? 'male' : 'female';

    function generarEstatura(sexo){
        return sexo === 'male' ? (165+Math.floor(Math.random()*20))+' cm' : (155+Math.floor(Math.random()*20))+' cm';
    }

    function generarExperiencia(){
        const estilos = ['Karate','Judo','Taekwondo','Kung Fu','Aikido','Kickboxing'];
        const cinturones = ['Blanco','Amarillo','Naranja','Verde','Azul','Marrón','Negro'];
        const estilo = estilos[Math.floor(Math.random()*estilos.length)];
        const cinturon = cinturones[Math.floor(Math.random()*cinturones.length)];
        return `${cinturon} en ${estilo}`;
    }

    fetch(`https://randomuser.me/api/?gender=${sexo}&inc=picture,dob`)
        .then(res => res.json())
        .then(data => {
            const user = data.results[0];
            const fotoUrl = user.picture.large;
            const edad = user.dob.age;

            document.getElementById('fotoPerfil').src = fotoUrl;
            document.getElementById('sexoPerfil').textContent = sexo==='male'?'Masculino':'Femenino';
            document.getElementById('edadPerfil').textContent = edad + ' años';
            document.getElementById('estaturaPerfil').textContent = generarEstatura(sexo);
            document.getElementById('experienciaPerfil').textContent = generarExperiencia();
        })
        .catch(err=>{
            console.error('Error al cargar perfil:',err);
            document.getElementById('fotoPerfil').alt='Foto no disponible';
        });
</script>

</body>
</html>
